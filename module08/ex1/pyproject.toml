[project]
name = "loading"
version = "0.1.0"
description = "Matrix data analysis demonstrating Poetry dependency management"
authors = [{ name = "jakoch", email = "jakoch@student.42berlin.de" }]
requires-python = ">=3.13,<4.0"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
numpy = "^2.5.1"
pandas = "^3.0.5"
matplotlib = "^3.11.1"
